[base]
env_name = rubik

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 16

[env]
max_steps = 80
scramble_depth = 10
curriculum_enabled = 0
curriculum_depth_0 = 3
curriculum_depth_1 = 5
curriculum_depth_2 = 8
curriculum_depth_3 = 10
fixed_mixed_enabled = 1
fixed_depth_8_prob = 0.10
fixed_depth_9_prob = 0.20
fixed_depth_10_prob = 0.70
fixed_mixed_count = 7
fixed_depth_0 = 14
fixed_prob_0 = 0.10
fixed_depth_1 = 15
fixed_prob_1 = 0.10
fixed_depth_2 = 16
fixed_prob_2 = 0.20
fixed_depth_3 = 17
fixed_prob_3 = 0.20
fixed_depth_4 = 18
fixed_prob_4 = 0.20
fixed_depth_5 = 19
fixed_prob_5 = 0.10
fixed_depth_6 = 20
fixed_prob_6 = 0.10
curriculum_min_episodes = 256
curriculum_success_threshold = 0.60
curriculum_ema_alpha = 0.05
step_penalty = 0.01
progress_reward = 0.03
solve_reward = 10.0
timeout_penalty = 1.0

[policy]
hidden_size = 256
num_layers = 4
expansion_factor = 1

[train]
total_timesteps = 300_000_000
learning_rate = 0.003
gamma = 0.98
gae_lambda = 0.9
ent_coef = 0.02
minibatch_size = 8192
horizon = 64

[sweep]
metric = perf

[sweep.env.scramble_depth]
distribution = uniform
min = 1
mean = 5
max = 10
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.01
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
max = 0.08
scale = auto
